name: Build Aseprite macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Clone Aseprite Source
        run: git clone --recursive --depth 1 --shallow-submodules https://github.com/aseprite/aseprite.git .

      - name: Install Build Tools
        run: brew install cmake ninja

      - name: Download Prebuilt Skia (arm64)
        run: |
          set -e
          mkdir -p $HOME/deps/skia
          SKIA_URL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/aseprite/skia/releases/latest \
            | grep "browser_download_url.*Skia-macOS-Release-arm64.zip" \
            | cut -d '"' -f 4)
          test -n "$SKIA_URL"
          curl -L "$SKIA_URL" -o skia.zip
          unzip -q skia.zip -d $HOME/deps/skia

      - name: Configure and Build
        run: |
          mkdir build && cd build
          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$HOME/deps/skia \
            -DSKIA_LIBRARY_DIR=$HOME/deps/skia/out/Release-arm64 \
            -DSKIA_LIBRARY=$HOME/deps/skia/out/Release-arm64/libskia.a \
            -G Ninja \
            ..
          ninja aseprite

      - name: Upload Compiled Package
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-macOS-arm64
          path: build/bin/
